name: WaveDrive APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare persistent APK signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WAVEDRIVE_KEYSTORE_BASE64 }}
          WAVEDRIVE_KEYSTORE_PASSWORD: ${{ secrets.WAVEDRIVE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$WAVEDRIVE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure WAVEDRIVE_KEYSTORE_BASE64 and WAVEDRIVE_KEYSTORE_PASSWORD repository secrets. See docs/SIGNING.md."
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wavedrive.p12"
          echo "WAVEDRIVE_KEYSTORE=$RUNNER_TEMP/wavedrive.p12" >> "$GITHUB_ENV"
      - name: Build signed APKs
        env:
          WAVEDRIVE_KEYSTORE_PASSWORD: ${{ secrets.WAVEDRIVE_KEYSTORE_PASSWORD }}
        run: bash scripts/build-apk.sh
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/wavedrive.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: WaveDrive-test-APK
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
      - name: Publish v1.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo "Release already exists"
          else
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk WaveDrive-v1.0.1-arm64.apk
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk WaveDrive-v1.0.1-arm32.apk
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk WaveDrive-v1.0.1-x86_64.apk
            gh release create v1.0.1 WaveDrive-v1.0.1-*.apk --target "$GITHUB_SHA" --title "WaveDrive" --latest --notes "Automatic startup update check and verified APK installer. Android Auto, stream recovery, and startup updates. Signed with the persistent release key. No AAB."
          fi
      - name: Remove superseded manual v1.0.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.1 --json assets --jq '[.assets[] | select(.name | endswith(".apk"))] | length' | grep -qx 3
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release delete v1.0.0 --cleanup-tag --yes
          elif git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            git push origin :refs/tags/v1.0.0
          fi
