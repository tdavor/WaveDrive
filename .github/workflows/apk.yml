name: WaveDrive APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WaveDrive-test-APK
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
      - name: Publish v1.0.0-alpha.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0-alpha.2 >/dev/null 2>&1; then
            echo "Release already exists"
          else
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk WaveDrive-v1.0.0-alpha.2-arm64.apk
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk WaveDrive-v1.0.0-alpha.2-arm32.apk
            cp build/app/outputs/flutter-apk/app-x86_64-release.apk WaveDrive-v1.0.0-alpha.2-x86_64.apk
            gh release create v1.0.0-alpha.2 WaveDrive-v1.0.0-alpha.2-*.apk --target "$GITHUB_SHA" --title "WaveDrive v1.0.0-alpha.2" --prerelease --notes "Redesigned Android interface and optimized architecture-specific release APKs. Uninstall previous debug build if signing differs; local data will be lost. Background playback requires device testing. Android Auto browsing and CarPlay are not complete. No AAB."
          fi
